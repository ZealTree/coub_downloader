name: Native builds and tagged releases
on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: windows-x64
          - runner: ubuntu-22.04
            target: linux-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 libxcb-cursor0 libglib2.0-0 libfreetype6 libfontconfig1 libdbus-1-3 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-randr0 libxcb-shape0 libxcb-xfixes0 libxcb-sync1 libxcb-xinerama0 libxcb-xkb1 xvfb xauth
      - name: Validate release version
        run: python ci/version.py
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Fetch verified native FFmpeg
        run: python ci/download_ffmpeg.py
      - name: Build native executable
        run: python build_windows.py --ffmpeg-dir build/ffmpeg-download/ffmpeg
      - name: Smoke-test executable
        run: python ci/smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/CoubDownloader-*
          if-no-files-found: error
          compression-level: 0
  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - name: Publish both executables to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
        run: python ci/publish_github.py
